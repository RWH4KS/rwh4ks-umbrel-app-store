manifestVersion: 1.1
id: rwh-ks-public-pool-bch-solo
name: RWH4KS Public Pool (BCH Solo)
tagline: Solo-mine BCH on ARM64 with your own self-contained pool + pruned node
icon: https://raw.githubusercontent.com/RWH4KS/rwh4ks-umbrel-app-store/master/rwh-ks-public-pool-bch-solo/icon.png
category: Utilities
version: "0.1.4"
port: 8080
description: >-
   Self-hosted BCH solo mining pool with BCHN (pruned), Stratum, API, and a lightweight web dashboard for Raspberry Pi 5. No APP tile. Go to terminal bash (sudo ./scripts/start)

   Stratum exposed on port 3563. To Access Dashboard (Umbrel.Local:8080) example 192.x.x.x:8080

   Support development - BCH (Legacy) - 17MmQyaBxdQp1E5WqU3T8iBBtcfFwRtxGd

   ** This pool software currently expects a Legacy (Base58) BCH address. Please convert it using a trusted converter.

developer: RWH4KS
