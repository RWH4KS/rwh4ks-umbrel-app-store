services:
  app_proxy:
    image: getumbrel/app-proxy:1.0.0
    restart: on-failure
    depends_on:
      - web
    env_file:
      - ./.env
    environment:
      APP_HOST: web
      APP_PORT: 80
      MANAGER_IP: ${MANAGER_IP}
      UMBREL_AUTH_SECRET: ${UMBREL_AUTH_SECRET}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./umbrel-app.yml:/extra/umbrel-app.yml:ro
    ports:
      - "${APP_UI_PORT:-8080}:4000"
    networks:
      - internal
      - umbrel_main_network

  web:
    image: nginx:alpine
    restart: on-failure
    stop_grace_period: 10s
    env_file:
      - ./.env
    networks:
      - internal
#    ports:
#      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/default.conf:/etc/nginx/conf.d/default.conf:ro

  bchn_rpc_proxy:
    image: nginx:alpine
    restart: on-failure
    stop_grace_period: 10s
    depends_on:
      bchn:
        condition: service_healthy
    env_file:
      - ./.env
    networks:
      - internal
    expose:
      - "8332"
    environment:
      APP_BCHN_RPC_USER: ${APP_BCHN_RPC_USER}
      APP_BCHN_RPC_PASSWORD: ${APP_BCHN_RPC_PASSWORD}
      BCH_RPC_BASIC: ${BCH_RPC_BASIC}
    volumes:
      - >-
        ./dashboard/bchn-rpc-proxy.conf.template:/templates/bchn-rpc-proxy.conf.template:ro
    command: >
      /bin/sh -lc '
        set -e;
        : "$${BCH_RPC_BASIC:?BCH_RPC_BASIC is missing}";
        envsubst < /templates/bchn-rpc-proxy.conf.template > /etc/nginx/conf.d/default.conf;
        nginx -t;
        exec nginx -g "daemon off;";
      '

  bchn:
    image: ghcr.io/rwh4ks/bchn-arm64:0.1.0
    platform: linux/arm64
    restart: on-failure
    stop_grace_period: 60s
    env_file:
      - ./.env
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --timeout=2 --user=$${APP_BCHN_RPC_USER}
          --password=$${APP_BCHN_RPC_PASSWORD} --header='Content-Type:
          application/json'
          --post-data='{"jsonrpc":"1.0","id":"hc","method":"getblockchaininfo","params":[]}'
          http://127.0.0.1:8332/ >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 60s
    environment:
      APP_BCHN_RPC_USER: ${APP_BCHN_RPC_USER}
      APP_BCHN_RPC_PASSWORD: ${APP_BCHN_RPC_PASSWORD}
    command:
      - /opt/bin/bitcoind
      - '-printtoconsole'
      - '-server=1'
      - '-prune=${APP_BCHN_PRUNE_MIB:-20480}'
      - '-rpcbind=0.0.0.0'
      - '-rpcallowip=10.0.0.0/8'
      - '-rpcallowip=172.16.0.0/12'
      - '-rpcallowip=192.168.0.0/16'
      - '-rpcuser=${APP_BCHN_RPC_USER}'
      - '-rpcpassword=${APP_BCHN_RPC_PASSWORD}'
    volumes:
      - ./data/bchn:/root/.bitcoin
    networks:
      internal:
        aliases:
          - bchn-1
      umbrel_main_network: null

  mariadb:
    image: mariadb:11
    restart: on-failure
    stop_grace_period: 60s
    env_file:
      - ./.env
    environment:
      MYSQL_DATABASE: ${APP_MARIADB_DATABASE}
      MYSQL_USER: ${APP_MARIADB_USER}
      MYSQL_PASSWORD: ${APP_MARIADB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${APP_MARIADB_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    networks:
      - internal

  memcached:
    image: memcached:1.6
    restart: on-failure
    stop_grace_period: 60s
    env_file:
      - ./.env
    command:
      - '-m'
      - '256'
      - '-o'
      - modern
    networks:
      - internal

  yiimp:
    image: ghcr.io/rwh4ks/yiimp-arm64:0.1.0
    restart: on-failure
    stop_grace_period: 60s
    depends_on:
      - mariadb
      - memcached
    env_file:
      - ./.env
    environment:
      DB_HOST: mariadb
      DB_NAME: ${APP_MARIADB_DATABASE}
      DB_USER: ${APP_MARIADB_USER}
      DB_PASS: ${APP_MARIADB_PASSWORD}
      MEMCACHED_HOST: memcached
    networks:
      - internal

  public-pool:
    image: ghcr.io/rwh4ks/public-pool-arm64:0.1.0
    restart: on-failure
    stop_grace_period: 60s
    depends_on:
      bchn:
        condition: service_healthy
      yiimp:
        condition: service_started
      mariadb:
        condition: service_started
      memcached:
        condition: service_started
    env_file:
      - ./.env
    environment:
      BCH_RPC_URL: http://bchn_rpc_proxy:8332
      BITCOIN_RPC_URL: http://bchn_rpc_proxy
      BITCOIN_RPC_PORT: "8332"
      BITCOIN_RPC_TIMEOUT: '5000'
      BITCOIN_RPC_USER: ${APP_BCHN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${APP_BCHN_RPC_PASSWORD}
      BCH_RPC_USER: ${APP_BCHN_RPC_USER}
      BCH_RPC_PASS: ${APP_BCHN_RPC_PASSWORD}
      STRATUM_PORT: 3563
      API_PORT: 3564
      DB_HOST: mariadb
      DB_NAME: ${APP_MARIADB_DATABASE}
      DB_USER: ${APP_MARIADB_USER}
      DB_PASS: ${APP_MARIADB_PASSWORD}
      MEMCACHED_HOST: memcached
    ports:
      - "3563:3563"
    networks:
      - internal
      - umbrel_main_network

networks:
  internal:
    driver: bridge
    internal: true
  umbrel_main_network:
    external: true
